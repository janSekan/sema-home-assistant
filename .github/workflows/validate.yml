name: Validate SEMA integration

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate HACS metadata
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: 'false'

  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-client-test.txt
      - run: python tools/check_project.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/client -v

  home-assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.5'
      - run: python -m pip install -r requirements-ha-test.txt -r requirements-validation.txt
      - run: python -m ruff check custom_components/sema tests tools
      - run: python -m ruff format --check custom_components/sema tests tools
      - run: python -m mypy
      - run: python -m pytest -c pytest-ha.ini -q --timeout=30

  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: home-assistant/core
          ref: 357cae5c598dfcd7a0ea7dc5b1facccd4ec6037b # 2026.10.4
          path: hassfest-core
          sparse-checkout: script
          persist-credentials: false
      - run: python -m pip install -r requirements-hassfest.txt
      - run: python tools/run_hassfest.py --core-path hassfest-core
