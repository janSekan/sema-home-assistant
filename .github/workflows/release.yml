name: Publish SEMA release

"on":
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify tag matches integration version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('custom_components/sema/manifest.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag does not match manifest version'
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "SEMA $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES.md
