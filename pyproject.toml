[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tools"]

[tool.ruff.lint.per-file-ignores]
# Tiny local fixtures are intentionally read synchronously in test coroutines.
"tests/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/sema"]
strict = true
follow_imports = "silent"
